{{- if .Values.serviceAccount.create -}}
{{- $managed := eq (include "lmutil.openshift-pull-secrets.enabled" .) "true" -}}
{{- $namespace := include "lmutil.release.namespace" . -}}
{{- $name := include "collectorset-controller.serviceAccountName" . -}}
{{- $clientSide := eq (include "lmutil.openshift-pull-secrets.client-side" (list . $name $namespace)) "true" -}}
{{- $collectorName := printf "%s-collector" $name -}}
{{- $collectorClientSide := eq (include "lmutil.openshift-pull-secrets.client-side" (list . $collectorName $namespace)) "true" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "collectorset-controller.serviceAccountName" . }}
  namespace: {{ template "lmutil.release.namespace" . }}
  labels:
    {{- include "collectorset-controller.labels" . | nindent 4}}
  annotations:
    {{- include "collectorset-controller.annotations" . | nindent 4}}
    {{- if $managed }}
    logicmonitor.com/pull-secrets-apply-mode: {{ ternary "client" "server" $clientSide | quote }}
    {{- end }}
{{- if $managed }}
{{ include "lmutil.openshift-pull-secrets.field" (list . $name $namespace (concat .Values.imagePullSecrets .Values.global.imagePullSecrets) $clientSide) }}
{{- else if or .Values.imagePullSecrets .Values.global.imagePullSecrets }}
imagePullSecrets:
  {{- include "lmutil.imagePullSecrets" . | nindent 2 }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "collectorset-controller.serviceAccountName" . }}-collector
  namespace: {{ template "lmutil.release.namespace" . }}
  labels:
    {{- include "collectorset-controller.labels" . | nindent 4}}
  annotations:
    {{- include "collectorset-controller.annotations" . | nindent 4}}
    {{- if $managed }}
    logicmonitor.com/pull-secrets-apply-mode: {{ ternary "client" "server" $collectorClientSide | quote }}
    {{- end }}
{{- if $managed }}
{{ include "lmutil.openshift-pull-secrets.field" (list . $collectorName $namespace (concat .Values.imagePullSecrets .Values.global.imagePullSecrets) $collectorClientSide) }}
{{- else if or .Values.imagePullSecrets .Values.global.imagePullSecrets }}
imagePullSecrets:
  {{- include "lmutil.imagePullSecrets" . | nindent 2 }}
{{- end }}
{{ end }}
