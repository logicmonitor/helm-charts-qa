{{- if .Values.serviceAccount.create -}}
{{- $managed := eq (include "lmutil.openshift-pull-secrets.enabled" .) "true" -}}
{{- $clientSide := eq (include "lmutil.openshift-pull-secrets.client-side" (list . (include "lmutil.serviceAccountName" .) (include "lmutil.release.namespace" .))) "true" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "lmutil.serviceAccountName" . }}
  namespace: {{ template "lmutil.release.namespace" . }}
  labels:
    {{- include "argus.labels" . | nindent 4 }}
  annotations:
    {{- include "argus.annotations" . | nindent 4 }}
    {{- if $managed }}
    logicmonitor.com/pull-secrets-apply-mode: {{ ternary "client" "server" $clientSide | quote }}
    {{- end }}
{{- if $managed }}
{{ include "lmutil.openshift-pull-secrets.field" (list . (include "lmutil.serviceAccountName" .) (include "lmutil.release.namespace" .) (concat .Values.imagePullSecrets .Values.global.imagePullSecrets) $clientSide) }}
{{- else if or .Values.imagePullSecrets .Values.global.imagePullSecrets }}
imagePullSecrets:
  {{- include "lmutil.imagePullSecrets" . | nindent 2 }}
{{- end }}
{{ end }}
