{{- if and (eq (include "lmutil.is-openshift" .) "true") (or (not (hasKey .Values.global "openshiftPullSecrets")) (not .Values.openshiftPullSecrets)) -}}
{{- fail "OpenShift pull-secret defaults are missing. Upgrade using --reset-then-reuse-values, or export helm get values and pass that file with --reset-values --values. Do not reuse the old chart defaults." -}}
{{- end -}}
{{- if eq (include "lmutil.openshift-pull-secrets.enabled" .) "true" -}}
{{- $root := . -}}
{{- $name := include "lm-container.pull-secrets.name" . -}}
{{- $bootstrapName := printf "%s-bootstrap" $name -}}
{{- $config := include "lm-container.pull-secrets.config" . | fromJson -}}
{{- range $bootstrap := list false true }}
{{- $resourceName := ternary $bootstrapName $name $bootstrap }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $resourceName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "lm-container.labels" $root | nindent 4 }}
  {{- if $bootstrap }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $resourceName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "lm-container.labels" $root | nindent 4 }}
  {{- if $bootstrap }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
data:
  targets.json: {{ include "lm-container.pull-secrets.config" $root | quote }}
  reconcile.py: |
    {{- $root.Files.Get "files/reconcile-pull-secrets.py" | nindent 4 }}
{{- range $namespace := $config.namespaces }}
{{- $accounts := list -}}
{{- range $config.targets -}}
{{- if eq .namespace $namespace -}}
{{- $accounts = append $accounts .name -}}
{{- end -}}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $resourceName }}
  namespace: {{ $namespace }}
  labels:
    {{- include "lm-container.labels" $root | nindent 4 }}
  {{- if $bootstrap }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
rules:
  {{- if and $bootstrap $accounts $config.createAccounts }}
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["create"]
  {{- end }}
  {{- if eq $namespace $root.Release.Namespace }}
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ $name | quote }}]
    verbs: ["get", "patch"]
  {{- end }}
  {{- if $accounts }}
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    resourceNames: {{ $accounts | uniq | toJson }}
    verbs: ["get", "patch"]
  {{- end }}
  {{- if not $bootstrap }}
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    resourceNames: [{{ $bootstrapName | quote }}]
    verbs: ["delete"]
  {{- if eq $namespace $root.Release.Namespace }}
  - apiGroups: [""]
    resources: ["configmaps", "serviceaccounts"]
    resourceNames: [{{ $bootstrapName | quote }}]
    verbs: ["delete"]
  {{- end }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $resourceName }}
  namespace: {{ $namespace }}
  labels:
    {{- include "lm-container.labels" $root | nindent 4 }}
  {{- if $bootstrap }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $resourceName }}
subjects:
  - kind: ServiceAccount
    name: {{ $resourceName }}
    namespace: {{ $root.Release.Namespace }}
{{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lm-container.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ include "lm-container.pull-secrets.config" . | sha256sum }}
        checksum/script: {{ .Files.Get "files/reconcile-pull-secrets.py" | sha256sum }}
    spec:
      {{- include "lm-container.pull-secrets.pod" (dict "root" . "name" $name) | nindent 6 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $bootstrapName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lm-container.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 120
  template:
    spec:
      {{- include "lm-container.pull-secrets.pod" (dict "root" . "name" $bootstrapName "restartPolicy" "Never" "args" (list "--once")) | nindent 6 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-cleanup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lm-container.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 120
  template:
    spec:
      {{- include "lm-container.pull-secrets.pod" (dict "root" . "name" $name "restartPolicy" "Never" "args" (list "--cleanup")) | nindent 6 }}
{{- end }}
