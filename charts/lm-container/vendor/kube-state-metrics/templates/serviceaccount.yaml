{{- if .Values.serviceAccount.create -}}
{{- $managed := eq (include "lmutil.openshift-pull-secrets.enabled" .) "true" -}}
{{- $clientSide := eq (include "lmutil.openshift-pull-secrets.client-side" (list . (include "kube-state-metrics.serviceAccountName" .) (include "kube-state-metrics.namespace" .))) "true" -}}
apiVersion: v1
kind: ServiceAccount
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
metadata:
  labels:
    {{- include "kube-state-metrics.labels" . | indent 4 }}
  name: {{ template "kube-state-metrics.serviceAccountName" . }}
  namespace: {{ template "kube-state-metrics.namespace" . }}
{{- if or .Values.serviceAccount.annotations $managed }}
  annotations:
    {{- if $managed }}
    logicmonitor.com/pull-secrets-apply-mode: {{ ternary "client" "server" $clientSide | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
{{ toYaml . | indent 4 }}
    {{- end }}
{{- end }}
{{- if $managed }}
{{ include "lmutil.openshift-pull-secrets.field" (list . (include "kube-state-metrics.serviceAccountName" .) (include "kube-state-metrics.namespace" .) (concat .Values.global.imagePullSecrets .Values.serviceAccount.imagePullSecrets) $clientSide) }}
{{- else if or .Values.serviceAccount.imagePullSecrets .Values.global.imagePullSecrets }}
imagePullSecrets:
  {{- include "kube-state-metrics.imagePullSecrets" (dict "Values" .Values "imagePullSecrets" .Values.serviceAccount.imagePullSecrets) | indent 2 }}
{{- end }}
{{- end -}}
